<header class="topbar">
  <span class="badge" id="versionBadge" title="App version">v1.1</span>
  <a class="brand" href="#tab=calc" aria-label="IBI Scientific Calculator, home">
    <svg class="mark" aria-hidden="true"><use href="#i-mark"/></svg>
    <span class="brand-t"><b>IBI Scientific Calculator</b><small>India Business International</small></span>
  </a>
  <div class="top-actions" id="topActions">
    <button type="button" class="iconbtn help-top" id="helpTop" aria-label="Help: how to use the calculator" title="Help: how to use the calculator" aria-expanded="false"><svg class="i"><use href="#i-help"/></svg><span class="pip" id="helpPip" hidden>0</span></button>
    <button type="button" class="top-btn" id="installTop" hidden><svg class="i"><use href="#i-install"/></svg><span>Install</span></button>
    <button type="button" class="switch" id="themeTop" role="switch" aria-checked="true" aria-label="Dark theme" title="Light / dark"><span class="track"><span class="knob"></span></span></button>
    <button type="button" class="iconbtn" id="menuBtn" aria-label="Menu and settings" title="Menu and settings"><svg class="i"><use href="#i-menu"/></svg></button>
  </div>
</header>

<nav class="tabs" id="tabs" aria-label="Calculator modes">
  <button type="button" data-tab="calc" class="on">Calculate</button>
  <button type="button" data-tab="eqn">Equations</button>
  <button type="button" data-tab="graph">Graph</button>
  <button type="button" data-tab="stat">Statistics</button>
  <button type="button" data-tab="matrix">Matrix</button>
  <button type="button" data-tab="vector">Vector</button>
  <button type="button" data-tab="calculus">Calculus</button>
  <button type="button" data-tab="base">Base-N</button>
  <button type="button" data-tab="units">Units</button>
  <button type="button" data-tab="const">Constants</button>
</nav>

<main id="main">
  <!-- ===== CALCULATE ===== -->
  <section class="view on" id="view-calc" data-view="calc">
    <div class="col col-in">
      <div class="card display" id="display">
        <div class="status">
          <button type="button" class="chip" id="angleChip" title="Angle unit: tap to change">DEG</button>
          <button type="button" class="chip" id="fmtChip" title="Number format: tap to change">Norm</button>
          <button type="button" class="chip" id="cplxChip" title="Complex numbers: tap to switch">ℝ</button>
          <span class="chip ghost" id="memChip" hidden title="A value is stored in memory M">M</span>
          <span class="chip ghost" id="shiftChip" hidden>2nd</span>
          <span class="grow"></span>
          <button type="button" class="iconbtn sm" id="kbdBtn" aria-label="Use the phone keyboard" title="Type with the keyboard"><svg class="i"><use href="#i-kbd"/></svg></button>
          <button type="button" class="iconbtn sm hist-open" id="histBtn" aria-label="History" title="History"><svg class="i"><use href="#i-hist"/></svg></button>
        </div>
        <label class="sr" for="expr">Expression</label>
        <textarea id="expr" class="expr" rows="1" spellcheck="false" autocomplete="off" autocapitalize="off" inputmode="none" placeholder="Tap a sum, e.g. 2(3+4)²"></textarea>
        <div class="natural" id="natural" aria-hidden="true"></div>
        <div class="result-row">
          <div class="result" id="result" aria-live="polite"><span class="muted">0</span></div>
        </div>
        <div class="result-sub" id="resultSub"></div>
        <div class="result-tools">
          <button type="button" class="pill" id="sdBtn" title="Switch between decimal and exact (fraction, π, √) form">S⇔D</button>
          <button type="button" class="pill" id="engBtn" title="Show in engineering notation">ENG</button>
          <button type="button" class="pill" id="dmsBtn" title="Show as degrees, minutes, seconds">°′″</button>
          <button type="button" class="pill" id="stoBtn" title="Store the answer in a variable">STO →</button>
          <span class="grow"></span>
          <button type="button" class="pill" id="copyBtn" title="Copy the answer"><svg class="i"><use href="#i-copy"/></svg>Copy</button>
        </div>
      </div>

      <div class="card keys-card">
        <div class="keybar">
          <div class="seg" role="tablist" aria-label="Keypad">
            <button type="button" data-pad="basic" role="tab">Basic</button>
            <button type="button" data-pad="sci" role="tab">Scientific</button>
          </div>
          <span class="grow"></span>
          <button type="button" class="pill" id="varsBtn" title="Variables A–F, x, y, z and memory M">Vars</button>
          <button type="button" class="pill" id="fnBtn" title="All functions"><svg class="i"><use href="#i-fn"/></svg>Functions</button>
        </div>
        <div class="memrow">
          <button type="button" class="k mem" data-k="MC" title="Clear memory">MC</button>
          <button type="button" class="k mem" data-k="MR" title="Recall memory">MR</button>
          <button type="button" class="k mem" data-k="M+" title="Add answer to memory">M+</button>
          <button type="button" class="k mem" data-k="M-" title="Subtract answer from memory">M−</button>
          <button type="button" class="k mem" data-k="Ans" title="Last answer">Ans</button>
        </div>
        <div class="pad" id="pad"></div>
      </div>
    </div>

    <div class="col col-out">
      <div class="card side" id="sidePanel">
        <div class="side-head">
          <div class="seg" role="tablist" aria-label="Side panel">
            <button type="button" data-side="hist" class="on">History</button>
            <button type="button" data-side="vars">Memory &amp; variables</button>
          </div>
          <span class="grow"></span>
          <button type="button" class="pill danger" id="histClear" title="Clear all history"><svg class="i"><use href="#i-trash"/></svg>Clear</button>
        </div>
        <div class="side-body" id="histList"></div>
        <div class="side-body" id="varList" hidden></div>
      </div>
      <div class="card tips">
        <h3>Try these</h3>
        <div class="examples" id="examples"></div>
      </div>
    </div>
  </section>

  <section class="view" id="view-eqn" data-view="eqn"></section>
  <section class="view" id="view-graph" data-view="graph"></section>
  <section class="view" id="view-stat" data-view="stat"></section>
  <section class="view" id="view-matrix" data-view="matrix"></section>
  <section class="view" id="view-vector" data-view="vector"></section>
  <section class="view" id="view-calculus" data-view="calculus"></section>
  <section class="view" id="view-base" data-view="base"></section>
  <section class="view" id="view-units" data-view="units"></section>
  <section class="view" id="view-const" data-view="const"></section>
</main>

<footer class="foot">
  <span>IBI Scientific Calculator <b id="footVer">v1.1</b> · India Business International · Works offline · Maths engine: math.js 15.2.0 (Apache-2.0)</span>
</footer>

  <svg class="mark" aria-hidden="true"><use href="#i-mark"/></svg>
  <div class="bt"><b>Install IBI Scientific Calculator</b><span id="installBannerText">Open it from your home screen like any app. Works offline.</span></div>
  <button type="button" class="btn" id="installBannerBtn">Install</button>
  <button type="button" class="iconbtn" id="installBannerX" aria-label="Not now"><svg class="i"><use href="#i-x"/></svg></button>
</div>

<div class="layer-root" id="layerRoot"></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="lib/math-15.2.0.min.js"></script>
<script src="app.js?v=1.1"></script>
<script src="tools.js?v=1.1"></script>
<script src="help.js?v=1.1"></script>
</body>
</html>
